name: Gerar cobrinha rosa

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:          
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-pink.svg?color_snake=#E75480&color_dots=#FDEEF3,#F8BBD0,#F48FB1,#F06292,#D63384

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
