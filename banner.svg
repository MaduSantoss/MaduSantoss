<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Maria Eduarda — Back-End Developer, C# e .NET">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1520"/>
      <stop offset="100%" stop-color="#140F17"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F48FB1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F48FB1"/>
      <stop offset="100%" stop-color="#F48FB1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F48FB1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F48FB1" stop-opacity="0"/>
    </radialGradient>
    <style>
      .name { font: 600 46px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #F8C8D8; letter-spacing: 1px; }
      .role { font: 400 16px 'Consolas', 'Fira Code', 'Courier New', monospace; fill: #B9A3AE; letter-spacing: 3px; }
      .in { animation: in 1.4s ease-out both; }
      .dot { animation: blink 4s ease-in-out infinite; }
      @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 0%,100% { opacity: .2; } 50% { opacity: .8; } }
    </style>
  </defs>

  <rect width="1200" height="200" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="199" rx="16" fill="none" stroke="#3A2833"/>
  <ellipse cx="600" cy="95" rx="360" ry="90" fill="url(#glow)"/>

  <g fill="#F48FB1">
    <circle class="dot" cx="180" cy="55" r="2"/>
    <circle class="dot" cx="1030" cy="60" r="2.5" style="animation-delay:1.3s"/>
    <circle class="dot" cx="1090" cy="140" r="1.8" style="animation-delay:2.4s"/>
    <circle class="dot" cx="110" cy="135" r="1.8" style="animation-delay:.7s"/>
  </g>

  <g class="in">
    <text class="name" x="600" y="98" text-anchor="middle">Maria Eduarda</text>
    <rect x="450" y="118" width="300" height="1.5" fill="url(#line)"/>
    <text class="role" x="600" y="150" text-anchor="middle">BACK-END DEVELOPER · C# · .NET</text>
  </g>
</svg>
